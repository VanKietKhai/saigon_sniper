<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Saigon Sniper Ground Truth Labeler</title>
    <link rel="stylesheet" href="/static/labeler.css">
  </head>
  <body>
    <main class="labeler-shell">
      <header>
        <p class="eyebrow">R1.3D V1</p>
        <h1>Saigon Sniper Ground Truth Labeler</h1>
        <p class="stage">Scaffold only — image labeling is not yet enabled.</p>
      </header>

      <section class="workspace" aria-label="Labeling scaffold">
        <div class="image-placeholder" aria-label="Image unavailable in scaffold">
          Image loading not implemented in R1.3D.1
        </div>
        <aside class="annotation-panel">
          <dl>
            <div><dt>Source ID</dt><dd>Not loaded</dd></div>
            <div><dt>Image</dt><dd>Not loaded</dd></div>
            <div><dt>Calibration</dt><dd>Not implemented</dd></div>
            <div><dt>Hole center</dt><dd>Not implemented</dd></div>
            <div><dt>Review status</dt><dd>Not implemented</dd></div>
          </dl>
          <button type="button" disabled>Save annotation</button>
          <button type="button" disabled>Next image</button>
        </aside>
      </section>
    </main>
    <script src="/static/labeler.js"></script>
  </body>
</html>
